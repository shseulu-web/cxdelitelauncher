plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.1.3'
}

group = 'com.cxdelite.launcher'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.6'
    modules = [ 'javafx.controls' ]
}

application {
    mainModule = 'com.cxdelite.launcher'
    mainClass = 'com.cxdelite.launcher.CxdEliteApp'
}

jlink {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'CxdEliteLauncher'
        jvmArgs = ['-Dfile.encoding=UTF-8']
    }
    jpackage {
        imageName = 'CxdElite Launcher'
        installerName = 'CxdEliteLauncher'
        installerType = 'exe'
        appVersion = project.version.toString()
        vendor = 'CxdElite'
        installerOptions = ['--win-menu', '--win-shortcut']
    }
}
